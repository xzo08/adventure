<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Невероятные приключения Гончи и Сони!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body { background: #18181b; overflow: hidden; touch-action: none; font-family: 'Courier New', Courier, monospace; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    #controls {
    position: fixed; bottom: 16px; left: 0; width: 100%; padding: 0 12px;
    display: flex; justify-content: space-between; pointer-events: none; z-index: 10;
  }
  .btn-group { display: flex; gap: 8px; pointer-events: auto; align-items: center; }
  .btn {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(30, 41, 59, 0.88); border: 3px solid #e2e8f0;
    color: #fff; font-size: 20px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 #090d16;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #090d16; }
  .btn-hit { background: rgba(220, 38, 38, 0.9); border-color: #fca5a5; font-size: 13px; }
  .btn-talk { background: rgba(22, 163, 74, 0.9); border-color: #86efac; font-size: 13px; }
  .btn-sit {
    display: none; width: auto; padding: 0 18px; border-radius: 16px;
    background: #facc15; border-color: #fef08a; color: #18181b; font-size: 15px;
  }
  #choices {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    display: none; flex-direction: column; gap: 10px; width: min(92vw, 560px); z-index: 20;
  }
  .choice-btn {
    background: #ffffff; border: 3px solid #18181b; color: #18181b;
    padding: 13px 18px; border-radius: 20px; font-family: inherit;
    font-size: 15px; font-weight: bold; text-align: left; cursor: pointer;
    box-shadow: 0 4px 0 #18181b; transition: transform 0.08s;
  }
  .choice-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #18181b; }
  .choice-bad { border-color: #dc2626; color: #b91c1c; background: #fef2f2; }
  .choice-good { border-color: #16a34a; color: #15803d; background: #f0fdf4; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="choices"></div>

<div id="controls">
  <div class="btn-group">
    <div class="btn" id="btn-left">◀</div>
    <div class="btn" id="btn-right">▶</div>
  </div>
  <div class="btn-group">
    <div class="btn btn-sit" id="btn-sit">СЕСТЬ</div>
    <div class="btn btn-talk" id="btn-talk">ЧАТ</div>
    <div class="btn btn-hit" id="btn-hit">УДАР</div>
    <div class="btn" id="btn-jump">▲</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const choicesEl = document.getElementById('choices');
const btnSit = document.getElementById('btn-sit');

let W, H, groundY;
function resize() {
  const oldGroundY = groundY;
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const isPortrait = H > W;
  groundY = Math.max(240, H - (isPortrait ? 130 : 105));

  if (typeof p1 !== 'undefined' && oldGroundY) {
    p1.y = groundY - p1.h;
    p2.y = groundY - p2.h;
    if (typeof obstacles !== 'undefined') {
      obstacles.forEach(o => {
        if (o.alive) o.y = groundY - o.h;
      });
    }
  }
}
window.addEventListener('resize', resize);
resize();

const keys = { left: false, right: false };
let level = 0, levelWidth = 2500;
let camX = 0, camY = 0, camZoom = 1.0;
let targetCamX = 0, targetCamY = 0, targetZoom = 1.0;

let gameState = 'TUTORIAL';
let currentQuest = 'Расспросить бабку на Кольце';
let hp = 10, maxHp = 10;
let startTime = Date.now(), elapsedSec = 0;
let stats = { poles: 0, dogs: 0, urns: 0, npcs: 0 };

let dialogQueue = [], currentLine = null, typedChars = 0, typeTimer = 0, dialogLockTimer = 0;
let dogIntroTimer = 0, phoneCrackShow = false, finaleStamp = 0;
let screenShake = 0, punchTimer = 0, animTime = 0;
const p1 = { x: 130, y: 0, vx: 0, vy: 0, w: 36, h: 56, dir: 1, grounded: false, sway: 0, walkPhase: 0, sitting: false, reachPocket: false };
const p2 = { x: 75, y: 0, w: 36, h: 54, dir: 1, sway: 0, walkPhase: 0, sitting: false };

let npcs = [], obstacles = [], particles = [], floatTexts = [];
let clouds = [
  { x: 160, y: 70, s: 1.1 }, { x: 680, y: 95, s: 0.9 },
  { x: 1250, y: 60, s: 1.2 }, { x: 1850, y: 85, s: 1.0 }
];

const levelsData = [
  {
    name: "ЛОКАЦИЯ 1: КОЛЬЦО",
    skyTop: "#38bdf8", skyBot: "#bae6fd", ground: "#64748b", grass: "#4ade80", width: 2500,
    questStart: "Расспросить бабку на Кольце",
    intro: [
      { who: "Ульяна", text: "Соняяя, я походу телефон потеряла..." },
      { who: "Соня", text: "Ты дура, где и как?!" },
      { who: "Ульяна", text: "Да я че ебу............. Пошли где были сегодня." }
    ],
    npcs: [
      {
        x: 680, name: "Бабка", role: "babka", talked: false, beaten: false, sway: 0, y: 0, flyVx: 0, flyVy: 0, rot: 0,
        startChoices: [
          {
            label: "Бабка, здарова! Мобилку не видела?",
            next: [
              { who: "Ульяна", text: "Бабка, здарова! Мобилку не видела?" },
              { who: "Бабка", text: "Нет, внучки, я вот сама только с магазина иду. Вы представляете, как цены поднялись?! Хлеб уже..." }
            ],
            choicesAfter: [
              {
                label: "(Продолжить слушать про цены)",
                next: [
                  { who: "Бабка", text: "...молоко подорожало, масло вообще золотое стало! А, вы про телефон? Видела, как девочка что-то с земли поднимала и побежала сразу же в Центр." }
                ]
              },
              {
                label: "(Перебить) Похуй, вы может кого-то подозрительного видели?",
                next: [
                  { who: "Ульяна", text: "Похуй, вы может кого-то подозрительного видели?" },
                  { who: "Бабка", text: "Ох и молодёжь пошла... Видела, как девочка что-то с земли поднимала и побежала сразу же в Центр." }
                ]
              }
            ]
          },
          {
            label: "Бабушка, здравствуйте! Телефон не видели?",
            next: [
              { who: "Ульяна", text: "Бабушка, здравствуйте! Телефон не видели?" },
              { who: "Бабка", text: "Нет, внучки, я вот сама только с магазина иду. Вы представляете, как цены поднялись?! Сахар..." }
            ],
            choicesAfter: [
              {
                label: "(Продолжить слушать)",
                next: [
                  { who: "Бабка", text: "...гречка тоже вверх пошла, ужас! Но я видела, как девочка что-то с земли поднимала и побежала сразу же в Центр." }
                ]
              },
              {
                label: "(Перебить) Похуй, вы может кого-то подозрительного видели?",
                next: [
                  { who: "Ульяна", text: "Похуй, вы может кого-то подозрительного видели?" },
                  { who: "Бабка", text: "Ну и грубиянка! Видела, как девочка что-то с земли поднимала и побежала сразу же в Центр." }
                ]
              }
            ]
          }
        ]
      }
    ],
    objects: [
      { x: 420, type: "urn", w: 30, h: 38, hp: 1, maxHp: 1, block: false },
      { x: 960, type: "urn", w: 30, h: 38, hp: 1, maxHp: 1, block: false },
      { x: 1200, type: "pole", w: 22, h: 155, hp: 1, maxHp: 1, block: true },
      { x: 1460, type: "urn", w: 30, h: 38, hp: 1, maxHp: 1, block: false },
      { x: 1750, type: "mad_dog", w: 54, h: 36, hp: 5, maxHp: 5, block: true, introShown: false, biteCd: 0 },
      { x: 2150, type: "urn", w: 30, h: 38, hp: 1, maxHp: 1, block: false }
    ]
  },
  {
    name: "ЛОКАЦИЯ 2: ЦЕНТР",
    skyTop: "#0284c7", skyBot: "#7dd3fc", ground: "#94a3b8", grass: "#22c55e", width: 2550,
    questStart: "Подойти к девке в Центре",
    intro: [
      { who: "Соня", text: "Ну, в Центре никого...." },
      { who: "Соня", text: "......", panToNpc: 0 },
      { who: "Ульяна", text: "Нет, вон смотри, какая-то стоит!" }
    ],
    npcs: [
      {
        x: 780, name: "Девочка", role: "girl", talked: false, beaten: false, sway: 0, y: 0, flyVx: 0, flyVy: 0, rot: 0,
        startChoices: [
          {
            label: "Слышишь, пиздючка, телефон мой где?!",
            next: [
              { who: "Ульяна", text: "Слышишь, пиздючка, телефон мой где?!" },
              { who: "Девочка", text: "Я не знаю, отстаньте!" },
              { who: "Соня", text: "А чё нам бабушка говорит, что ты какой-то телефон подбирала?!" },
              { who: "Девочка", text: "Так я свой телефон уронила! Вот, смотрите!", showCrackedPhone: true },
              { who: "Ульяна", text: "И правда не мой........." },
              { who: "Соня", text: "Ну и что нам делать?" },
              { who: "Ульяна", text: "Не знаю, пошли куда-то присядем." }
            ]
          },
          {
            label: "Ты не видела тут телефон?",
            next: [
              { who: "Ульяна", text: "Ты не видела тут телефон?" },
              { who: "Девочка", text: "Я не знаю." },
              { who: "Соня", text: "А чё нам бабушка говорит, что ты какой-то телефон подбирала?!" },
              { who: "Девочка", text: "Так я свой телефон уронила! Вот, посмотрите!", showCrackedPhone: true },
              { who: "Ульяна", text: "И правда не мой........." },
              { who: "Соня", text: "Ну и что нам делать?" },
              { who: "Ульяна", text: "Не знаю, пошли куда-то присядем." }
            ]
          }
        ]
      }
    ],
    objects: [
      { x: 460, type: "urn", w: 30, h: 38, hp: 1, maxHp: 1, block: false },
      { x: 1080, type: "urn", w: 30, h: 38, hp: 1, maxHp: 1, block: false },
      { x: 1320, type: "pole", w: 22, h: 155, hp: 1, maxHp: 1, block: true },
      { x: 1540, type: "urn", w: 30, h: 38, hp: 1, maxHp: 1, block: false },
      { x: 1760, type: "urn", w: 30, h: 38, hp: 1, maxHp: 1, block: false },
      { x: 2020, type: "pole", w: 22, h: 155, hp: 1, maxHp: 1, block: true },
      { x: 2280, type: "urn", w: 30, h: 38, hp: 1, maxHp: 1, block: false }
    ]
  },
  {
    name: "ЛОКАЦИЯ 3: ГЛАГОЛЕВКА",
    skyTop: "#312e81", skyBot: "#fb923c", ground: "#64748b", grass: "#15803d", width: 1700,
    questStart: "Подойти к беседке и присесть",
    intro: [
      { who: "Соня", text: "Да не бойся ты, найдём мы его." },
      { who: "Ульяна", text: "Пошли на беседку." }
    ],
    npcs: [],
    objects: [
      { x: 420, type: "urn", w: 30, h: 38, hp: 1, maxHp: 1, block: false },
      { x: 740, type: "urn", w: 30, h: 38, hp: 1, maxHp: 1, block: false },
      { x: 980, type: "urn", w: 30, h: 38, hp: 1, maxHp: 1, block: false }
    ],
    gazeboX: 1180
  }
];
function loadLevel(idx) {
  level = idx;
  const data = levelsData[level];
  levelWidth = data.width;
  currentQuest = data.questStart;
  p1.x = 130; p1.y = groundY - p1.h; p1.vx = 0; p1.vy = 0; p1.sitting = false; p1.reachPocket = false;
  p2.x = 75; p2.y = groundY - p2.h; p2.sitting = false;
  camX = p1.x + W * 0.15; camY = H / 2; camZoom = 1.0;
  btnSit.style.display = 'none';

  npcs = JSON.parse(JSON.stringify(data.npcs));
  obstacles = JSON.parse(JSON.stringify(data.objects));
  obstacles.forEach(o => { o.y = groundY - o.h; o.alive = true; o.flyVx = 0; o.flyVy = 0; o.rot = 0; o.hitFlash = 0; });

  if (data.intro) {
    startDialog(data.intro);
  }
}

function showChoices(choices, onAllDone) {
  choicesEl.innerHTML = '';
  choicesEl.style.display = 'flex';
  choices.forEach((ch) => {
    const btn = document.createElement('button');
    const isAggro = /здарова|похуй|пиздючка/i.test(ch.label);
    const toneClass = isAggro ? 'choice-bad' : 'choice-good';
    btn.className = 'choice-btn ' + toneClass;
    btn.textContent = (isAggro ? '💢 ' : '💬 ') + ch.label;
    btn.onclick = () => {
      choicesEl.style.display = 'none';
      const afterCb = ch.choicesAfter
        ? () => showChoices(ch.choicesAfter, onAllDone)
        : onAllDone;
      startDialog(ch.next, afterCb);
    };
    choicesEl.appendChild(btn);
  });
}

function startDialog(lines, onComplete = null) {
  gameState = 'DIALOG';
  dialogQueue = lines.map(l => ({ ...l }));
  currentLine = dialogQueue.shift();
  currentLine.onComplete = onComplete;
  typedChars = 0;
  typeTimer = 0;
  dialogLockTimer = 55;
  checkLineSpecials(currentLine);
}

function checkLineSpecials(line) {
  if (!line) return;
  if (line.showCrackedPhone) phoneCrackShow = true;
  if (line.reachPocket) p1.reachPocket = true;
}

function advanceDialog() {
  if (choicesEl.style.display === 'flex' || dialogLockTimer > 0) return;
  if (phoneCrackShow) phoneCrackShow = false;
  if (!currentLine) return;

  if (typedChars < currentLine.text.length) {
    typedChars = currentLine.text.length;
    dialogLockTimer = 48;
    return;
  }

  const cb = currentLine.onComplete;
  if (dialogQueue.length > 0) {
    currentLine = dialogQueue.shift();
    currentLine.onComplete = cb;
    typedChars = 0;
    typeTimer = 0;
    dialogLockTimer = 48;
    checkLineSpecials(currentLine);
  } else {
    currentLine = null;
    gameState = 'PLAY';
    if (cb) cb();
  }
}

function triggerGazeboScene() {
  btnSit.style.display = 'none';
  gameState = 'GAZEBO_SCENE';
  const gzX = 1180;
  p2.x = gzX + 18;
  p2.dir = 1;
  p2.sitting = true;

  setTimeout(() => {
    p1.x = gzX + 124;
    p1.dir = -1;
    p1.sitting = true;

    setTimeout(() => {
      startDialog([
        { who: "Ульяна", text: "Погоди.........." },
        { who: "Ульяна", text: "(Лезет в задний карман джинсов и достаёт свой телефон!)", reachPocket: true },
        { who: "Соня", text: "Оййй, дурааааа!!" }
      ], () => {
        elapsedSec = Math.floor((Date.now() - startTime) / 1000);
        gameState = 'FINALE';
        finaleStamp = 0.05;
      });
    }, 1000);
  }, 900);
}
function jump() {
  if (gameState === 'DOG_INTRO') return;
  if (gameState === 'DIALOG') { advanceDialog(); return; }
  if (gameState !== 'PLAY') return;
  if (p1.grounded) {
    p1.vy = -12.5;
    p1.grounded = false;
  }
}

function punch() {
  if (gameState === 'DOG_INTRO') return;
  if (gameState === 'DIALOG') { advanceDialog(); return; }
  if (gameState !== 'PLAY') return;

  punchTimer = 15;
  const hitX = p1.x + (p1.dir === 1 ? p1.w + 38 : -38);

  for (let obj of obstacles) {
    if (!obj.alive) continue;
    if (Math.abs((obj.x + obj.w / 2) - hitX) < 65 && Math.abs(obj.y - p1.y) < 90) {
      if (obj.type === 'mad_dog') {
        const isCrit = Math.random() < 0.30;
        const dmg = isCrit ? 2 : 1;
        obj.hp -= dmg;
        obj.hitFlash = 10;
        screenShake = isCrit ? 12 : 6;
        spawnParticles(obj.x + obj.w / 2, obj.y + 15, isCrit ? '#facc15' : '#ef4444', isCrit ? 18 : 10);
        floatTexts.push({
          x: obj.x + 15, y: obj.y - 25,
          text: isCrit ? `КРИТ! -${dmg} HP!` : `-${dmg} HP`,
          color: isCrit ? '#facc15' : '#f87171', life: 55
        });
        if (obj.hp <= 0) {
          obj.alive = false;
          obj.block = false;
          obj.flyVx = p1.dir * 15;
          obj.flyVy = -12;
          stats.dogs++;
          currentQuest = "Квест выполнен! Идём в Центр ➔";
          floatTexts.push({ x: obj.x, y: obj.y - 45, text: "СОБАКА ОТПИЗЖЕНА!", color: '#4ade80', life: 80 });
        }
      } else {
        obj.alive = false;
        obj.block = false;
        obj.flyVx = p1.dir * 14;
        obj.flyVy = -11;
        screenShake = 7;
        if (obj.type === 'pole') stats.poles++;
        if (obj.type === 'urn') stats.urns++;
        spawnParticles(obj.x + obj.w / 2, obj.y + obj.h / 2, '#cbd5e1', 14);
        floatTexts.push({
          x: obj.x, y: obj.y - 25,
          text: obj.type === 'pole' ? "СТОЛБ СНЕСЁН!" : "МУСОРКА УЛЕТЕЛА!",
          color: '#38bdf8', life: 55
        });
      }
    }
  }

  for (let npc of npcs) {
    if (npc.talked && !npc.beaten && Math.abs((npc.x + 17) - hitX) < 68) {
      npc.beaten = true;
      npc.flyVx = p1.dir * 16;
      npc.flyVy = -13;
      npc.rot = 0;
      screenShake = 10;
      stats.npcs++;
      spawnParticles(npc.x + 17, groundY - 30, '#facc15', 18);
      floatTexts.push({
        x: npc.x + 15, y: groundY - 65,
        text: npc.role === 'babka' ? "ОЙ-ЁЙ, СПИНА МОЯ!!" : "ААА, ПОМОГИТЕ!!",
        color: '#ef4444', life: 65
      });
    }
  }
}

function interact() {
  if (gameState === 'DOG_INTRO') return;
  if (gameState === 'DIALOG') { advanceDialog(); return; }
  if (gameState !== 'PLAY') return;

  for (let npc of npcs) {
    if (!npc.beaten && Math.abs(p1.x - npc.x) < 110) {
      p1.dir = npc.x >= p1.x ? 1 : -1;
      if (!npc.talked && npc.startChoices) {
        gameState = 'DIALOG';
        showChoices(npc.startChoices, () => {
          npc.talked = true;
          if (level === 0) currentQuest = "Сбить столб и пройти дальше";
          if (level === 1) currentQuest = "Снести столбы и пойти в Глаголевку";
        });
      }
      return;
    }
  }
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 9,
      vy: (Math.random() - 1) * 8,
      life: 25 + Math.random() * 15,
      color
    });
  }
}

function bindBtn(id, onDown, onUp = null) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); onDown(); });
  el.addEventListener('mousedown', e => { e.preventDefault(); onDown(); });
  if (onUp) {
    el.addEventListener('touchend', e => { e.preventDefault(); onUp(); });
    el.addEventListener('mouseup', e => { onUp(); });
    el.addEventListener('mouseleave', e => { onUp(); });
  }
}

bindBtn('btn-left', () => keys.left = true, () => keys.left = false);
bindBtn('btn-right', () => keys.right = true, () => keys.right = false);
bindBtn('btn-jump', () => jump());
bindBtn('btn-hit', () => punch());
bindBtn('btn-talk', () => interact());
btnSit.onclick = () => triggerGazeboScene();

canvas.addEventListener('touchstart', e => {
  if (gameState === 'DIALOG') { e.preventDefault(); interact(); }
});
canvas.addEventListener('mousedown', e => {
  if (gameState === 'DIALOG') { interact(); }
});

window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') jump();
  if (e.code === 'KeyZ' || e.code === 'KeyJ') punch();
  if (e.code === 'KeyE' || e.code === 'Enter') interact();
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});
function update() {
  animTime += 0.14;
  if (screenShake > 0) screenShake--;
  if (punchTimer > 0) punchTimer--;
  if (dialogLockTimer > 0) dialogLockTimer--;
  if (finaleStamp > 0 && finaleStamp < 1) finaleStamp = Math.min(1, finaleStamp + 0.07);

  for (let c of clouds) {
    c.x -= 0.22 * c.s;
    if (c.x < -150) c.x = levelWidth + 150;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.4; pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    let ft = floatTexts[i];
    ft.y -= 1.0; ft.life--;
    if (ft.life <= 0) floatTexts.splice(i, 1);
  }

  p1.sway = 0; p2.sway = 0;
  for (let npc of npcs) npc.sway = 0;

  if (gameState === 'DIALOG' && currentLine) {
    if (typedChars < currentLine.text.length) {
      typeTimer++;
      if (typeTimer >= 11) { typedChars++; typeTimer = 0; }
    }
    const wobble = Math.sin(animTime * 1.6) * 0.09;
    if (currentLine.who === "Ульяна") p1.sway = wobble;
    else if (currentLine.who === "Соня") p2.sway = wobble;
    else {
      for (let npc of npcs) {
        if (npc.name === currentLine.who) npc.sway = wobble;
      }
    }

    targetZoom = 1.38;
    if (currentLine.panToNpc !== undefined && npcs[currentLine.panToNpc]) {
      targetCamX = npcs[currentLine.panToNpc].x;
    } else if (npcs.length > 0 && Math.abs(p1.x - npcs[0].x) < 160) {
      targetCamX = (p1.x + npcs[0].x) / 2;
    } else {
      targetCamX = (p1.x + p2.x) / 2;
    }
    targetCamY = groundY - 40;
  } else if (gameState === 'DOG_INTRO') {
    const dog = obstacles.find(o => o.type === 'mad_dog');
    targetZoom = 1.72;
    targetCamX = dog ? dog.x + 25 : p1.x + 150;
    targetCamY = groundY - 25;
    dogIntroTimer++;
    if (dogIntroTimer === 10 || dogIntroTimer === 35 || dogIntroTimer === 60 || dogIntroTimer === 85) {
      screenShake = 8;
    }
    if (dogIntroTimer >= 165) {
      gameState = 'PLAY';
    }
  } else if (gameState === 'GAZEBO_SCENE') {
    targetZoom = 1.48;
    targetCamX = 1180 + 88;
    targetCamY = groundY - 45;
  } else {
    targetZoom = 1.0;
    targetCamX = Math.max(W / 2, Math.min(levelWidth - W / 2, p1.x + W * 0.15));
    targetCamY = H / 2;
  }

  camZoom += (targetZoom - camZoom) * 0.09;
  camX += (targetCamX - camX) * 0.1;
  camY += (targetCamY - camY) * 0.1;

  if (gameState !== 'PLAY') return;

  const speed = 3.2;
  if (keys.left) { p1.vx = -speed; p1.dir = -1; }
  else if (keys.right) { p1.vx = speed; p1.dir = 1; }
  else { p1.vx = 0; }

  if (Math.abs(p1.vx) > 0.1 && p1.grounded) p1.walkPhase += 0.25;
  else p1.walkPhase = 0;

  let nextX = p1.x + p1.vx;

  for (let npc of npcs) {
    if (!npc.talked && nextX > npc.x + 15) {
      nextX = npc.x + 15;
      if (Math.random() < 0.04) floatTexts.push({ x: npc.x, y: groundY - 75, text: "Сначала поговори! [ЧАТ]", color: '#fde047', life: 45 });
    }
  }

  for (let obj of obstacles) {
    if (obj.hitFlash > 0) obj.hitFlash--;

    if (obj.type === 'mad_dog' && obj.alive && !obj.introShown && Math.abs(p1.x - obj.x) < 340) {
      obj.introShown = true;
      gameState = 'DOG_INTRO';
      dogIntroTimer = 0;
      currentQuest = "Отпиздить собаку (5 HP)";
      return;
    }

    if (obj.type === 'mad_dog' && obj.alive && obj.introShown) {
      if (obj.biteCd > 0) obj.biteCd--;
      const dist = p1.x - obj.x;
      if (Math.abs(dist) > 48) {
        obj.x += Math.sign(dist) * 2.1;
      } else if (obj.biteCd <= 0) {
        obj.biteCd = 65;
        hp = Math.max(0, hp - 1);
        screenShake = 9;
        floatTexts.push({ x: p1.x, y: p1.y - 25, text: "КУСЬ! -1 HP", color: '#ef4444', life: 45 });
        if (hp <= 0) {
          gameState = 'GAMEOVER';
          return;
        }
      }
    }

    if (obj.block && obj.alive) {
      if (nextX + p1.w > obj.x && nextX < obj.x + obj.w) {
        nextX = p1.x;
        if (obj.type === 'pole' && Math.random() < 0.04) {
          floatTexts.push({ x: obj.x, y: groundY - 165, text: "Не перепрыгнуть! Сбей [УДАР]", color: '#38bdf8', life: 45 });
        }
      }
    }
  }

  p1.x = Math.max(20, Math.min(levelWidth - 60, nextX));

  p1.vy += 0.65;
  p1.y += p1.vy;
  if (p1.y >= groundY - p1.h) {
    p1.y = groundY - p1.h;
    p1.vy = 0;
    p1.grounded = true;
  }

  const targetP2X = p1.x - (p1.dir * 52);
  const p2Move = (targetP2X - p2.x) * 0.08;
  p2.x += p2Move;
  if (Math.abs(p2Move) > 0.3) p2.walkPhase += 0.25;
  else p2.walkPhase = 0;
  p2.dir = p1.x >= p2.x ? 1 : -1;

  for (let obj of obstacles) {
    if (!obj.alive) {
      obj.x += obj.flyVx;
      obj.y += obj.flyVy;
      obj.flyVy += 0.55;
      obj.rot += 0.22;
    }
  }

  for (let npc of npcs) {
    if (npc.beaten) {
      npc.x += npc.flyVx;
      npc.y = (npc.y || 0) + npc.flyVy;
      npc.flyVy += 0.55;
      npc.rot += 0.25;
    }
  }

  if (level === 2) {
    const distGz = Math.abs(p1.x - (1180 + 88));
    btnSit.style.display = distGz < 130 ? 'flex' : 'none';
  }

  if (level < 2 && p1.x >= levelWidth - 110) {
    loadLevel(level + 1);
  }
}
function pxRect(x, y, w, h, color, outline = true) {
  if (outline) {
    ctx.fillStyle = '#18181b';
    ctx.fillRect(Math.floor(x - 2), Math.floor(y - 2), Math.floor(w + 4), Math.floor(h + 4));
  }
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawShadow(x, y, w) {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
  ctx.beginPath();
  ctx.ellipse(Math.floor(x + w / 2), Math.floor(y), w * 0.58, 6, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawObstacles() {
  for (let obj of obstacles) {
    if (obj.alive) drawShadow(obj.x, groundY + 2, obj.w);
    ctx.save();
    ctx.translate(obj.x + obj.w / 2, obj.y + obj.h / 2);
    ctx.rotate(obj.rot);

    if (obj.type === 'pole') {
      const w2 = obj.w / 2;
      const h2 = obj.h / 2;
      pxRect(-w2 - 5, h2 - 16, obj.w + 10, 16, '#475569');
      pxRect(-w2, -h2 + 12, obj.w, obj.h - 28, '#94a3b8');
      ctx.fillStyle = '#64748b';
      ctx.fillRect(0, -h2 + 14, w2 - 2, obj.h - 32);

      const flutter = Math.sin(animTime * 2 + obj.x) * 2;
      pxRect(-w2 - 2, -10, 12, 16, '#fef08a');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-w2 + 4, 12, 10, 12 + flutter);

      pxRect(-w2 - 3, -44, obj.w + 6, 22, '#334155');
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-2, -37, 4, 8);

      pxRect(-w2 - 12, -h2, obj.w + 16, 8, '#1e293b');
      pxRect(-w2 - 16, -h2 + 6, 18, 9, '#475569');

      const flicker = Math.sin(animTime * 9 + obj.x) > -0.6;
      ctx.fillStyle = flicker ? '#fde047' : '#713f12';
      ctx.fillRect(-w2 - 14, -h2 + 13, 14, 5);
      if (flicker && Math.random() < 0.15) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-w2 - 12 + (Math.random() - 0.5) * 14, -h2 + 18 + Math.random() * 10, 3, 3);
      }
    } else if (obj.type === 'urn') {
      pxRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h, '#15803d');
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(-obj.w / 2 + 3, -obj.h / 2 + 6, 6, obj.h - 10);
      pxRect(-obj.w / 2 - 3, -obj.h / 2, obj.w + 6, 7, '#4ade80');
      pxRect(-obj.w / 2 - 2, obj.h / 2 - 5, obj.w + 4, 5, '#1e293b');
    } else if (obj.type === 'mad_dog') {
      const isFlash = obj.hitFlash > 0;
      const furMain = isFlash ? '#ffffff' : '#78350f';
      const furDark = isFlash ? '#ffffff' : '#451a03';
      const furLight = isFlash ? '#ffffff' : '#b45309';

      const w2 = obj.w / 2;
      const h2 = obj.h / 2;
      const runLeg = (obj.alive && obj.introShown) ? Math.sin(animTime * 2.2) * 5 : 0;
      const tailWag = Math.sin(animTime * 3.0) * 4;

      pxRect(w2 - 2, -h2 + 4 + tailWag, 12, 6, furDark);

      pxRect(w2 - 14 - runLeg, h2 - 10, 8, 12, furDark);
      pxRect(w2 - 8 + runLeg, h2 - 10, 8, 12, furMain);
      pxRect(-w2 + 8 + runLeg, h2 - 10, 8, 12, furDark);
      pxRect(-w2 + 14 - runLeg, h2 - 10, 8, 12, furMain);

      pxRect(-w2 + 4, -h2 + 6, obj.w - 6, obj.h - 14, furMain);
      ctx.fillStyle = furDark;
      ctx.fillRect(-w2 + 6, -h2 + 6, obj.w - 10, 6);
      ctx.fillStyle = furLight;
      ctx.fillRect(-w2 + 8, h2 - 12, obj.w - 14, 4);

      pxRect(-w2 + 3, -h2 + 4, 6, obj.h - 12, '#dc2626');
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(-w2 + 4, -h2 + 7, 3, 2);
      ctx.fillRect(-w2 + 4, -h2 + 14, 3, 2);

      pxRect(-w2 - 8, -h2 - 6, 20, 20, furMain);
      pxRect(-w2 + 2, -h2 - 14, 6, 9, furDark);
      pxRect(-w2 + 8, -h2 - 12, 5, 7, furMain);

      pxRect(-w2 - 16, -h2 + 2, 11, 11, furLight);
      ctx.fillStyle = '#090d16';
      ctx.fillRect(-w2 - 17, -h2 + 2, 4, 4);
      ctx.fillRect(-w2 - 15, -h2 + 8, 10, 5);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-w2 - 14, -h2 + 8, 2, 3);
      ctx.fillRect(-w2 - 9, -h2 + 8, 2, 3);
      ctx.fillRect(-w2 - 12, -h2 + 11, 2, 2);

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-w2 - 4, -h2 - 1, 5, 4);
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(-w2 - 3, -h2, 2, 2);
      ctx.fillStyle = '#090d16';
      ctx.fillRect(-w2 - 5, -h2 - 3, 7, 2);

      if (obj.alive && obj.introShown) {
        const bw = 54;
        pxRect(-bw / 2, -obj.h / 2 - 22, bw, 8, '#18181b');
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-bw / 2 + 1, -obj.h / 2 - 21, (bw - 2) * (obj.hp / obj.maxHp), 6);
      }
    }
    ctx.restore();
  }
}
function drawSpeechBubble(targetX, targetY, speaker, text) {
  const maxW = Math.min(340, W - 40);
  ctx.font = 'bold 14px Courier New';
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (let w of words) {
    if (ctx.measureText(cur + w).width > maxW - 28 && cur !== '') {
      lines.push(cur.trim());
      cur = w + ' ';
    } else {
      cur += w + ' ';
    }
  }
  if (cur.trim()) lines.push(cur.trim());

  const boxW = Math.max(150, maxW);
  const boxH = 34 + lines.length * 18;
  const bx = Math.max(14, Math.min(W - boxW - 14, targetX - boxW / 2));
  const minTopY = H > W ? 136 : 66;
  const by = Math.max(minTopY, targetY - boxH - 34);

  const cx = Math.max(bx + 20, Math.min(bx + boxW - 20, targetX));
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#18181b';
  ctx.lineWidth = 3;
  const dots = new Array([cx, targetY - 10, 4], [cx, targetY - 21, 6], [cx, targetY - 33, 8]);
  dots.forEach(([px, py, r]) => {
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  });

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(bx, by, boxW, boxH, 18);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#dc2626';
  ctx.font = 'bold 13px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText(speaker, bx + 14, by + 19);

  ctx.fillStyle = '#18181b';
  ctx.font = 'bold 14px Courier New';
  lines.forEach((ln, idx) => {
    ctx.fillText(ln, bx + 14, by + 38 + idx * 18);
  });
}

function drawDogStamp() {
  ctx.save();
  ctx.translate(W / 2, H / 2 - 20);
  ctx.rotate(-0.06);

  const sw = Math.min(480, W - 30);
  const sh = 155;
  ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
  ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 6;
  ctx.strokeRect(-sw / 2 + 4, -sh / 2 + 4, sw - 8, sh - 8);

  ctx.textAlign = 'center';
  ctx.font = 'bold 34px Courier New';

  let topWord = '';
  if (dogIntroTimer >= 10) topWord += 'ЕБ';
  if (dogIntroTimer >= 35) topWord += 'НУ';
  if (dogIntroTimer >= 60) topWord += 'ТАЯ';

  if (topWord) {
    const pulseTop = (dogIntroTimer < 70 && dogIntroTimer % 25 < 6) ? 1.25 : 1.0;
    ctx.save();
    ctx.scale(pulseTop, pulseTop);
    ctx.fillStyle = '#ef4444';
    ctx.fillText(topWord, 0, -24);
    ctx.restore();
  }

  if (dogIntroTimer >= 85) {
    const pulseBot = dogIntroTimer < 93 ? 1.3 : 1.0;
    ctx.save();
    ctx.scale(pulseBot, pulseBot);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('СОБАКА', 0, 16);
    ctx.restore();

    ctx.fillStyle = '#fde047';
    ctx.font = 'bold 15px Courier New';
    ctx.fillText('Она явно не хочет подружиться!', 0, 52);
  }

  ctx.restore();
}

function drawCrackedPhoneOverlay() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
  ctx.fillRect(0, 0, W, H);

  const pw = Math.min(230, W * 0.55);
  const ph = Math.min(410, H * 0.72);
  const px = (W - pw) / 2;
  const py = (H - ph) / 2 - 20;

  ctx.fillStyle = '#090d16';
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.roundRect(px, py, pw, ph, 26);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#1e293b';
  ctx.fillRect(px + 12, py + 28, pw - 24, ph - 56);

  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 2;
  const cx = px + pw * 0.42, cy = py + ph * 0.38;
  const cracks = new Array(
    [cx, cy, px + 14, py + 32], [cx, cy, px + pw - 14, py + 55],
    [cx, cy, px + pw - 16, py + ph - 40], [cx, cy, px + 16, py + ph - 60],
    [cx, cy, px + pw * 0.5, py + 30], [px + 55, py + 95, px + pw - 45, py + 120],
    [px + 40, py + 180, px + pw - 35, py + 210], [px + 65, py + 260, px + pw - 50, py + 230]
  );
  cracks.forEach(([x1, y1, x2, y2]) => {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  });

  ctx.fillStyle = '#fde047';
  ctx.font = 'bold 15px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('Чужой разбитый телефон (нажми чтобы убрать)', W / 2, py + ph + 28);
}
function draw() {
  const data = levelsData[level];

  const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
  skyGrad.addColorStop(0, data.skyTop);
  skyGrad.addColorStop(1, data.skyBot);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(camZoom, camZoom);
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }
  ctx.translate(-camX, -camY);

  for (let c of clouds) {
    pxRect(c.x, c.y, 70 * c.s, 22 * c.s, 'rgba(255,255,255,0.85)', false);
    pxRect(c.x + 14 * c.s, c.y - 10 * c.s, 42 * c.s, 16 * c.s, 'rgba(255,255,255,0.9)', false);
  }

  const sunX = camX - W * 0.25;
  const sunY = level === 2 ? groundY - 145 : 95;
  ctx.fillStyle = level === 2 ? 'rgba(251, 146, 60, 0.35)' : 'rgba(254, 240, 138, 0.35)';
  ctx.beginPath(); ctx.arc(sunX, sunY, level === 2 ? 75 : 52, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = level === 2 ? '#fdba74' : '#fef08a';
  ctx.beginPath(); ctx.arc(sunX, sunY, level === 2 ? 48 : 34, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  for (let b = 0; b < 4; b++) {
    const bx = ((animTime * 14 + b * 420) % (levelWidth + 200)) - 100;
    const by = 85 + b * 24 + Math.sin(animTime + b) * 6;
    const wing = Math.sin(animTime * 2.5 + b) * 5;
    ctx.beginPath();
    ctx.moveTo(bx - 8, by + wing); ctx.lineTo(bx, by); ctx.lineTo(bx + 8, by + wing);
    ctx.stroke();
  }

  for (let lx = 260; lx < levelWidth - 150; lx += 540) {
    pxRect(lx, groundY - 135, 6, 135, '#334155');
    pxRect(lx - 8, groundY - 142, 22, 8, '#1e293b');
    ctx.fillStyle = level === 2 ? '#fde047' : '#fef9c3';
    ctx.fillRect(lx - 5, groundY - 134, 16, 6);
    if (level === 2) {
      ctx.fillStyle = 'rgba(253, 224, 71, 0.16)';
      ctx.beginPath();
      ctx.moveTo(lx - 4, groundY - 128);
      ctx.lineTo(lx - 38, groundY);
      ctx.lineTo(lx + 44, groundY);
      ctx.lineTo(lx + 10, groundY - 128);
      ctx.closePath();
      ctx.fill();
    }
  }

  if (level === 0) drawRingLandmarks();
  else if (level === 1) drawCenterLandmarks();
  else if (level === 2) drawGlagolevkaAndGazebo();

  if (level < 2) {
    const exitX = levelWidth - 110;
    pxRect(exitX, groundY - 72, 8, 72, '#78350f');
    pxRect(exitX - 28, groundY - 74, 66, 28, '#facc15');
    ctx.fillStyle = '#18181b';
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('ДАЛЕЕ ➔', exitX + 5, groundY - 55);
  }

  ctx.fillStyle = data.ground;
  ctx.fillRect(-500, groundY, levelWidth + 1000, H + 500);
  pxRect(-500, groundY, levelWidth + 1000, 14, data.grass);
  for (let gx = -400; gx < levelWidth + 400; gx += 64) {
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(gx, groundY + 18, 4, H + 400);
  }

  for (let npc of npcs) drawNPC(npc);
  drawObstacles();
  drawSonya(p2);
  drawUlyana(p1, punchTimer > 0);

  for (let pt of particles) pxRect(pt.x, pt.y, 6, 6, pt.color);
  ctx.font = 'bold 16px Courier New';
  ctx.textAlign = 'center';
  for (let ft of floatTexts) {
    ctx.fillStyle = '#18181b'; ctx.fillText(ft.text, ft.x + 17, ft.y + 2);
    ctx.fillStyle = ft.color || '#fde047'; ctx.fillText(ft.text, ft.x + 15, ft.y);
  }

  ctx.restore();

    if (gameState !== 'FINALE' && gameState !== 'GAMEOVER') {
    const isPortrait = H > W;
    const panelW = isPortrait ? W - 24 : 270;

    pxRect(12, 12, panelW, 54, 'rgba(15, 23, 42, 0.88)');
    ctx.fillStyle = '#fde047';
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(data.name, 22, 31);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Courier New';
    ctx.fillText(`HP: ${hp}/${maxHp}`, 22, 52);
    ctx.fillStyle = '#334155';
    ctx.fillRect(102, 42, panelW - 114, 13);
    ctx.fillStyle = hp > 3 ? '#22c55e' : '#ef4444';
    ctx.fillRect(102, 42, (panelW - 114) * (hp / maxHp), 13);

    const qx = isPortrait ? 12 : W - Math.min(310, W * 0.44) - 12;
    const qy = isPortrait ? 74 : 12;
    const qw = isPortrait ? W - 24 : Math.min(310, W * 0.44);

    pxRect(qx, qy, qw, 52, 'rgba(15, 23, 42, 0.88)');
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 12px Courier New';
    ctx.fillText('ТЕКУЩЕЕ ЗАДАНИЕ:', qx + 10, qy + 20);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px Courier New';
    ctx.fillText(currentQuest, qx + 10, qy + 40);
  }

  if (gameState === 'DIALOG' && currentLine) {
    let speakerWorldX = p1.x + p1.w / 2;
    if (currentLine.who === 'Соня') speakerWorldX = p2.x + p2.w / 2;
    else {
      const npc = npcs.find(n => n.name === currentLine.who);
      if (npc) speakerWorldX = npc.x + 17;
    }
    const screenX = (speakerWorldX - camX) * camZoom + W / 2;
    const screenY = (groundY - 62 - camY) * camZoom + H / 2;
    drawSpeechBubble(screenX, screenY, currentLine.who, currentLine.text.substring(0, typedChars));
  }

  if (gameState === 'DOG_INTRO') drawDogStamp();
  if (phoneCrackShow) drawCrackedPhoneOverlay();

  if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.86)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ef4444';
    ctx.font = 'bold 32px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('СОБАКА ЗАГРЫЗЛА!', W / 2, H / 2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '18px Courier New';
    ctx.fillText('Обнови страницу или нажми F5', W / 2, H / 2 + 25);
  }

  if (gameState === 'FINALE') {
    drawFinaleReport();
  }
}

function drawFinaleReport() {
  ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
  ctx.fillRect(0, 0, W, H);

  const bw = Math.min(460, W - 30);
  const bh = 365;
  const bx = (W - bw) / 2;
  const by = (H - bh) / 2;

  ctx.save();
  ctx.translate(W / 2, H / 2);
  const sc = 2.0 - finaleStamp * 1.0;
  ctx.scale(sc, sc);
  ctx.translate(-W / 2, -H / 2);

  pxRect(bx, by, bw, bh, '#0f172a');
  ctx.strokeStyle = '#fde047';
  ctx.lineWidth = 4;
  ctx.strokeRect(bx + 4, by + 4, bw - 8, bh - 8);

  ctx.fillStyle = '#fde047';
  ctx.font = 'bold 24px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('МОБИЛА НАШЛАСЬ!', W / 2, by + 42);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px Courier New';
  ctx.fillText(`Время прохождения: ${elapsedSec} сек.`, W / 2, by + 84);
  ctx.fillText(`Отпизжено собак: ${stats.dogs}`, W / 2, by + 114);
  ctx.fillText(`Снесено столбов: ${stats.poles}`, W / 2, by + 144);
  ctx.fillText(`Сбито мусорок: ${stats.urns}`, W / 2, by + 174);
  ctx.fillText(`Отпизжено жителей: ${stats.npcs}`, W / 2, by + 204);

  const btnW = (bw - 50) / 2;
  const btnY = by + 260;
  pxRect(bx + 18, btnY, btnW, 56, '#16a34a');
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Courier New';
  ctx.fillText('НАЧАТЬ ЗАНОВО', bx + 18 + btnW / 2, btnY + 33);

  pxRect(bx + 32 + btnW, btnY, btnW, 56, '#dc2626');
  ctx.fillStyle = '#fff';
  ctx.fillText('ВЫЙТИ', bx + 32 + btnW + btnW / 2, btnY + 33);

  ctx.restore();
}

function handleFinaleTap(clientX, clientY) {
  if (gameState !== 'FINALE') return;
  const bw = Math.min(460, W - 30);
  const bh = 365;
  const bx = (W - bw) / 2;
  const by = (H - bh) / 2;
  const btnW = (bw - 50) / 2;
  const btnY = by + 260;

  const rect = canvas.getBoundingClientRect();
  const mx = clientX - rect.left;
  const my = clientY - rect.top;

  if (my >= btnY && my <= btnY + 56) {
    if (mx >= bx + 18 && mx <= bx + 18 + btnW) {
      hp = 10;
      stats = { poles: 0, dogs: 0, urns: 0, npcs: 0 };
      startTime = Date.now();
      gameState = 'PLAY';
      loadLevel(0);
    } else if (mx >= bx + 32 + btnW && mx <= bx + 32 + btnW * 2) {
      window.close();
      window.location.href = 'https://google.com';
    }
  }
}

canvas.addEventListener('click', e => handleFinaleTap(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => {
  if (gameState === 'FINALE' && e.touches.length > 0) {
    handleFinaleTap(e.touches.clientX, e.touches.clientY);
  }
});

function showTutorial() {
  gameState = 'TUTORIAL';
  const overlay = document.createElement('div');
  overlay.id = 'tut-box';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.88);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;';
  overlay.innerHTML = `
    <div style="background:#1e293b;border:4px solid #fde047;border-radius:18px;padding:22px;max-width:440px;width:100%;color:#fff;font-family:inherit;box-shadow:0 8px 0 #090d16;">
      <h2 style="color:#fde047;text-align:center;margin-bottom:14px;font-size:20px;">КАК ИГРАТЬ</h2>
      <p style="margin-bottom:10px;line-height:1.4;">◀ / ▶ (или A / D) — ходить влево и вправо.</p>
      <p style="margin-bottom:10px;line-height:1.4;">💬 ЧАТ (или E) — говорить с людьми на пути.</p>
      <p style="margin-bottom:10px;line-height:1.4;">👊 УДАР (или Z) — сбивать мусорки, бить злых собак и не только.</p>
      <p style="margin-bottom:18px;line-height:1.4;color:#38bdf8;">⚡ ПРЫЖОК + УДАР — чтобы сломать высокий столб на дороге!</p>
      <button id="tut-start" style="width:100%;padding:12px;background:#16a34a;border:3px solid #86efac;border-radius:12px;color:#fff;font-weight:bold;font-size:16px;font-family:inherit;cursor:pointer;">ПОНЯТНО, ПОГНАЛИ!</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('tut-start').onclick = () => {
    overlay.remove();
    startTime = Date.now();
    gameState = 'PLAY';
    loadLevel(0);
  };
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

showTutorial();
loop();
</script>
